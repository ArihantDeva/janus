[tools]
python = "3.11"
uv = "0.9.7"

[tasks.check]
description = "Full local gate: label rules + metrics + dataset integrity"
run = "bash scripts/check.sh"

[tasks.test]
description = "Unit tests only (fast)"
run = "python -m pytest tests/ -q"

[tasks.sync]
description = "Push code and data to the Amarel cluster"
run = "bash scripts/sync.sh"

[tasks.train]
description = "Run the 1B LoRA rung on Amarel (3 seeds)"
run = "bash scripts/train.sh"

[tasks.probe]
description = "Glimmer 30B zero-shot probe on Amarel (4-bit, 1 GPU)"
run = "bash scripts/probe.sh"

[tasks.hook-check]
description = "Offline backend, hook transport and input contracts"
run = "bash scripts/check_boundaries.sh hook"

[tasks.runner-check]
description = "Validation launcher stops at the first failing scope"
run = "bash scripts/check_boundaries.sh runner"

[tasks.remote-check]
description = "Durable Amarel transport, warm service and installed configuration"
run = "bash scripts/check_boundaries.sh remote"

[tasks.encoder-check]
description = "Require model dependencies; verify encoder and checkpoint boundaries"
run = "bash scripts/check_boundaries.sh encoder"

[tasks.release-check]
description = "All tests with model dependencies required, offline"
run = "bash scripts/check_boundaries.sh release"

[tasks.mutation-check]
description = "Reintroduce guarded boundary defects in disposable copies"
run = "bash scripts/check_boundaries.sh mutations"

[tasks.llama]
description = "Build llama.cpp with CUDA on Amarel (for the Muse Code demo)"
run = "bash scripts/build_llama_amarel.sh"
